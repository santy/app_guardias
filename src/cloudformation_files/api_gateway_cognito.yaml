      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/api/profesores-guardia"

  AbsencesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:

      FunctionName: !Ref ReportAbsenceFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/api/reportar-ausencia"

  UsersInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UserManagementFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/api/users"

  UsersPostInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UserManagementFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/api/users"

  UsersDeleteInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UserManagementFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/DELETE/api/users/*"

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiOptions
      - TeachersOptions
      - GuardScheduleOptions
      - AbsencesOptions
      - ReportAbsenceOptions
      - UsersOptions
      - UsersUsernameOptions
      - TeachersGet
      - GuardScheduleGet
      - AbsencesGet
      - ReportAbsencePost
      - UsersGet
      - UsersPost
      - UsersDelete
    Properties:
      RestApiId: !Ref RestApi
      Description: "Deployment with user create endpoint - v6"

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref StageName

  # Gateway Responses for CORS on errors
  UnauthorizedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

  AccessDeniedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

Outputs:
  # API Gateway Outputs
  BaseUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  TeachersUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/teachers"
  GuardScheduleUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/profesores-guardia"
  AbsencesUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/ausencias-profesores"

  # Cognito Outputs
  UserPoolId:
    Description: ID del User Pool de Cognito
    Value: !Ref GuardiasUserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"
  
  UserPoolClientId:
    Description: ID del Client del User Pool
    Value: !Ref GuardiasUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
  
  UserPoolArn:
    Description: ARN del User Pool
    Value: !GetAtt GuardiasUserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"

  HostedUIURL:
    Description: URL de la página de inicio de sesión
    Value: !Sub "https://${GuardiasUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${GuardiasUserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=http://localhost:5173"

AWSTemplateFormatVersion: "2010-09-09"
Description: "app-guardias - API Gateway REST + 3 Lambdas + Cognito Authentication"

Parameters:
  StageName:
    Type: String
    Default: prod

  CodeBucket:
    Type: String
    Description: "S3 bucket donde subir los ZIPs de Lambda"

  TeachersZipKey:
    Type: String
    Default: teachers.zip
    Description: "S3 key del ZIP de teachers (ej: lambdas/teachers.zip)"

  GuardScheduleZipKey:
    Type: String
    Default: profesores-guardia.zip
    Description: "S3 key del ZIP de profesores-guardia"

  AbsencesZipKey:
    Type: String
    Default: ausencias-profesores.zip
    Description: "S3 key del ZIP de ausencias-profesores"

  ReportAbsenceZipKey:
    Type: String
    Default: reportar-ausencia.zip
    Description: "S3 key del ZIP de reportar-ausencia"

  UserManagementZipKey:
    Type: String
    Default: gestion-usuarios.zip
    Description: "S3 key del ZIP de gestion-usuarios"

Resources:
  # DynamoDB Tables
  TeachersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: guardias-teachers
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 2
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: prod
        - Key: Application
          Value: guardias

  GuardScheduleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: guardias-profesores-guardia
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: prod
        - Key: Application
          Value: guardias

  AbsencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: guardias-ausencias-profesores
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 15
        WriteCapacityUnits: 10
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 10
            WriteCapacityUnits: 5
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: prod
        - Key: Application
          Value: guardias

  # Cognito User Pool
  GuardiasUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: guardias-user-pool
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  GuardiasUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      ClientName: guardias-app-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - http://localhost:5173
      LogoutURLs:
        - http://localhost:5173
      SupportedIdentityProviders:
        - COGNITO

  GuardiasUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      Domain: !Sub "guardias-${AWS::AccountId}"

  # Cognito Groups
  ProfesoresGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      GroupName: profesores
      Description: Grupo de profesores con acceso a la aplicación

  JefaturaGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      GroupName: jefatura
      Description: Grupo de jefatura con permisos de gestión

  AdministradoresGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      GroupName: administradores
      Description: Grupo de administradores con permisos completos

  # Test Users
  ProfesorUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      Username: profesor@example.com
      UserAttributes:
        - Name: email
          Value: profesor@example.com
      MessageAction: SUPPRESS

  JefaturaUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      Username: jefatura@example.com
      UserAttributes:
        - Name: email
          Value: jefatura@example.com
      MessageAction: SUPPRESS

  AdministradorUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      Username: admin@example.com
      UserAttributes:
        - Name: email
          Value: admin@example.com
      MessageAction: SUPPRESS

  # User to Group Attachments
  ProfesorUserToGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      Username: !Ref ProfesorUser
      GroupName: !Ref ProfesoresGroup

  JefaturaUserToGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      Username: !Ref JefaturaUser
      GroupName: !Ref JefaturaGroup

  AdministradorUserToGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Properties:
      UserPoolId: !Ref GuardiasUserPool
      Username: !Ref AdministradorUser
      GroupName: !Ref AdministradoresGroup

  # Lambda Functions
  TeachersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: app-guardias-teachers
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Runtime: nodejs20.x
      Handler: teachers/index.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref TeachersZipKey

  GuardScheduleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: app-guardias-profesores-guardia
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Runtime: nodejs20.x
      Handler: profesores-guardia/index.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref GuardScheduleZipKey

  AbsencesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: app-guardias-ausencias-profesores
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Runtime: nodejs20.x
      Handler: ausencias-profesores/index.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref AbsencesZipKey

  ReportAbsenceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: app-guardias-reportar-ausencia-v2
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Runtime: nodejs20.x
      Handler: reportar-ausencia/index.handler
      Environment:
        Variables:
          VERSION: "2.1"
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref ReportAbsenceZipKey

  UserManagementFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: app-guardias-gestion-usuarios
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Runtime: nodejs20.x
      Handler: gestion-usuarios/index.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref UserManagementZipKey

  # API Gateway REST API
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: app-guardias-lambda-api
      EndpointConfiguration:
        Types: [REGIONAL]

  # Cognito Authorizer
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      RestApiId: !Ref RestApi
      Name: CognitoAuthorizer
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt GuardiasUserPool.Arn

  # API Resources
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: api

  TeachersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResource
      PathPart: teachers

  GuardScheduleResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResource
      PathPart: profesores-guardia

  AbsencesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResource
      PathPart: ausencias-profesores

  ReportAbsenceResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResource
      PathPart: reportar-ausencia

  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResource
      PathPart: users

  UsersUsernameResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref UsersResource
      PathPart: "{username}"

  # Methods with Cognito Authorization
  TeachersGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TeachersResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TeachersFunction.Arn}/invocations"
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
          - StatusCode: 401
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 401
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  GuardScheduleGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref GuardScheduleResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GuardScheduleFunction.Arn}/invocations"
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
          - StatusCode: 401
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 401
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  AbsencesGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AbsencesResource

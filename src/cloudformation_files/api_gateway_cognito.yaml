      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/api/ausencias-profesores"

  ReportAbsenceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
